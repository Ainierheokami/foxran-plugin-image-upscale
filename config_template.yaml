# 图片放大插件配置。
# 指定 models.yaml 里的图像编辑模型名（推荐 gpt-image-2）；留空则按 image_edit 标签轮询可用模型。
model_name: ""

# 未指定倍率时的放大倍率。
default_scale: 2.0

# 允许的最大放大倍率。
max_scale: 4.0

# 候选切块（输出）尺寸，即每块交给模型重绘的画布大小。按块数最少优先挑一个。
tile_sizes:
  - 1024x1024
  - 1536x1024
  - 1024x1536

# 相邻切块的冗余比例（相对切块短边），冗余区用于对齐和找拼缝。范围 0.02~0.45。
overlap_ratio: 0.15

# 单张图最多切多少块（每块一次模型调用）；超出时自动降低倍率。
max_tiles: 16

# 输出总像素上限；超出时自动降低倍率。
max_output_pixels: 40000000

# 同时请求模型的切块数。
max_concurrency: 3

# 单块失败、对不齐或与原图偏差过大时自动重绘的次数（每块单独计算，只重绘这一块，每次一次模型调用）。
# 自动重试用完仍失败的块，可以事后用 /放大重试 单独再画，不用整张重来。
retries: 1

# 是否把模型重绘的切块对齐回原图位置（特征点匹配修正整体平移/缩放）。
align: true

# 整体对齐后，若整块仍有明显挪动（位移中位数 ≥ 3 像素），再用光流修正局部挪动。
# 模型没跑偏时不会动它，避免扭动被模型改过的字。
local_flow: true

# 在比字形更粗的尺度上比较模型图和原图的结构（局部相关性），相关性下降超过多少（0~100）算内容挪位或丢失。
# 只比较结构：模型把颜色画得更鲜艳、天空画得更亮、把乱码改成正确的字，都不算。
# 只有成片的偏差（至少占一块的 1%）才会用原图插值填补。调大更信任模型，调小更保守。
layout_threshold: 40.0

# 一块里偏差区域占比超过多少就重绘一次（受 retries 限制）；偏差区域最终用原图插值填补。
max_deviation: 0.08

# 校色强度 0~1：各块先做低频校色，拼好后再按原图整体校正，消除色差和纯色区域的接缝；0 关闭。
color_correction: 0.8

# 拼缝羽化半径（像素）。
seam_feather: 6.0

# 局部换切法重绘：第一轮拼好后，找出失败、对不齐、用原图插值填补过的区域，以及相邻两块在冗余区画得不一致的地方
# （多半是切线正好切开了字，两块怎么画都对不上），只在这块局部换一种切法重新切块，让被切开的内容完整落在一块里，
# 重绘后拼回。不重切整张图；每块一次模型调用。
refine: true

# 局部重绘的切块尺寸（输出像素）。误差区域放得进一块，就切一块以它为中心的；放不下（比如整块失败）再按这些尺寸另切网格。
refine_tile_sizes:
  - 768x768
  - 1024x768
  - 768x1024

# 误差区域较大、要切成多块时，这些块之间的冗余比例。范围 0.02~0.45。
refine_overlap_ratio: 0.3

# 误差区域向外留的上下文（像素）。新切口会在这个范围内挪到原图里最空的行列上，避免又切到字。
refine_margin: 64

# 一次放大里局部重绘最多调用几次模型；超出时优先补大的误差区域。0 等于关闭。
refine_max_tiles: 8

# 某块重试仍失败时用普通插值顶上（结果里会注明），关闭则整张失败。
fallback_on_failure: true

# 放大前先让视觉模型通读整张图，按上下文找出错别字和乱码（如“做蠣启德”应为“坐落启德”），
# 把修正写进每块的提示词。命令后面写的文字（text_hint）会作为校对依据。多一次模型调用；失败不影响放大。
proofread: true

# 校对用的视觉模型名（models.yaml）；留空按 vision 标签选。
proofread_model: ""

# 附加在每块提示词末尾的自定义要求。
prompt: ""

# 保留最近多少次放大记录（原图和每块结果，存在 data/image_hd_upscale/jobs/，供 /放大重试 使用）；0 表示一直保留。
keep_jobs: 0

# 调试用：把每块的模型原图、修正后结果和填补区域保存到 tmp/image_hd_upscale/debug/。
save_tiles: false

# 输出格式：png / jpg / webp。
output_format: png

# jpg / webp 质量。
jpeg_quality: 95

# PNG 超过此大小（MB）时改存为 jpg；0 不限制。
max_output_mb: 20
